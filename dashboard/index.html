<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw Agent Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-table: #161b22;
    --bg-row-hover: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --gray: #484f58;
    --orange: #d18616;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  header h1 span.logo { font-size: 28px; }
  .header-controls { display: flex; align-items: center; gap: 12px; }
  .btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--bg-row-hover); }
  .btn.active { border-color: var(--green); color: var(--green); }
  .last-updated { font-size: 12px; color: var(--text-dim); }

  /* Stats cards */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .stat-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .value { font-size: 28px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace; }
  .stat-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* Section */
  .section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .section-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-header h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .section-count { font-size: 12px; background: var(--border); color: var(--text-dim); padding: 2px 8px; border-radius: 10px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.5; }
  th .sort-arrow.active { opacity: 1; color: var(--accent); }
  td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tr:hover td { background: var(--bg-row-hover); }
  tr:last-child td { border-bottom: none; }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-completed, .badge-done { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-running, .badge-implement, .badge-plan, .badge-review, .badge-fix { background: rgba(88,166,255,0.15); color: var(--blue); }
  .badge-failed, .badge-error { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-blocked, .badge-pending { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge-starting, .badge-queued { background: rgba(72,79,88,0.3); color: var(--text-dim); }
  .badge-cancelled, .badge-aborted { background: rgba(72,79,88,0.3); color: var(--text-dim); }
  .badge-active { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-removed { background: rgba(72,79,88,0.3); color: var(--text-dim); }
  .badge-claude { background: rgba(188,140,255,0.15); color: var(--purple); }
  .badge-codex { background: rgba(209,134,22,0.15); color: var(--orange); }

  /* Pipeline visualization */
  .pipeline-flow {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-wrap: wrap;
  }
  .stage-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: nowrap;
  }
  .stage-chip.completed { background: rgba(63,185,80,0.2); color: var(--green); }
  .stage-chip.running { background: rgba(88,166,255,0.2); color: var(--blue); }
  .stage-chip.failed { background: rgba(248,81,73,0.2); color: var(--red); }
  .stage-chip.blocked, .stage-chip.pending { background: rgba(210,153,34,0.2); color: var(--yellow); }
  .stage-chip.starting, .stage-chip.queued { background: rgba(72,79,88,0.3); color: var(--text-dim); }
  .stage-arrow { color: var(--text-dim); font-size: 11px; margin: 0 2px; }

  .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

  .truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Responsive */
  @media (max-width: 768px) {
    .container { padding: 12px; }
    header h1 { font-size: 18px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card .value { font-size: 22px; }
    td, th { padding: 8px 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="logo">🐝</span> OpenClaw Agent Dashboard</h1>
    <div class="header-controls">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="btn" id="refreshBtn" onclick="refresh()">🔄 Refresh</button>
      <button class="btn" id="autoRefreshBtn" onclick="toggleAutoRefresh()">⏱ Auto-refresh</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="label">Total Sessions</div><div class="value" id="statSessions">–</div><div class="sub" id="statSessionsSub"></div></div>
    <div class="stat-card"><div class="label">Pipeline Runs</div><div class="value" id="statPipelines">–</div><div class="sub" id="statPipelinesSub"></div></div>
    <div class="stat-card"><div class="label">Total Cost</div><div class="value" id="statCost">–</div><div class="sub" id="statCostSub"></div></div>
    <div class="stat-card"><div class="label">Active Worktrees</div><div class="value" id="statWorktrees">–</div><div class="sub" id="statWorktreesSub"></div></div>
  </div>

  <!-- Pipeline Runs -->
  <div class="section">
    <div class="section-header">
      <h2>🔄 Pipeline Runs <span class="section-count" id="pipelineCount">0</span></h2>
    </div>
    <div class="table-wrap" id="pipelineSection"></div>
  </div>

  <!-- Active Worktrees -->
  <div class="section">
    <div class="section-header">
      <h2>🌳 Active Worktrees <span class="section-count" id="worktreeCount">0</span></h2>
    </div>
    <div class="table-wrap" id="worktreeSection"></div>
  </div>

  <!-- Recent Sessions -->
  <div class="section">
    <div class="section-header">
      <h2>💬 Recent Sessions <span class="section-count" id="sessionCount">0</span></h2>
    </div>
    <div class="table-wrap" id="sessionSection"></div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────
let autoRefresh = true;
let autoRefreshTimer = null;
let sortState = {};  // { tableId: { col, asc } }

// ── Helpers ──────────────────────────────────────────────────────────────

function relTime(dateStr) {
  if (!dateStr) return '–';
  const d = new Date(dateStr + (dateStr.endsWith('Z') ? '' : 'Z'));
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 0) return 'just now';
  const s = Math.floor(diff / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const days = Math.floor(h / 24);
  return days + 'd ago';
}

function fullTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + (dateStr.endsWith('Z') ? '' : 'Z'));
  return d.toLocaleString();
}

function duration(startStr, endStr) {
  if (!startStr) return '–';
  const start = new Date(startStr + (startStr.endsWith('Z') ? '' : 'Z'));
  const end = endStr ? new Date(endStr + (endStr.endsWith('Z') ? '' : 'Z')) : new Date();
  const s = Math.floor((end - start) / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return m + 'm ' + rs + 's';
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return h + 'h ' + rm + 'm';
}

function cost(v) {
  if (v == null || v === 0) return '$0.00';
  return '$' + Number(v).toFixed(2);
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function statusBadge(status) {
  if (!status) return '<span class="badge badge-starting">unknown</span>';
  const icons = {
    completed: '✅', done: '✅', running: '🔵', failed: '❌', error: '❌',
    starting: '⚪', queued: '⏳', blocked: '🟡', pending: '🟡',
    active: '🟢', removed: '⚫', cancelled: '⛔', aborted: '⛔',
    implement: '🔨', plan: '📋', review: '🔍', fix: '🔧',
  };
  const icon = icons[status] || '⚪';
  return `<span class="badge badge-${esc(status)}">${icon} ${esc(status)}</span>`;
}

function harnessBadge(harness) {
  if (!harness) return '–';
  const lower = harness.toLowerCase();
  if (lower.includes('claude')) return '<span class="badge badge-claude">🤖 Claude</span>';
  if (lower.includes('codex')) return '<span class="badge badge-codex">🧬 Codex</span>';
  return `<span class="badge badge-starting">${esc(harness)}</span>`;
}

function stageIcon(status) {
  const map = { completed: '✅', done: '✅', running: '🔄', failed: '❌', error: '❌', starting: '⚪', blocked: '🟡', pending: '🟡', queued: '⏳' };
  return map[status] || '⚪';
}

function stageClass(status) {
  if (!status) return 'starting';
  if (['completed', 'done'].includes(status)) return 'completed';
  if (['running'].includes(status)) return 'running';
  if (['failed', 'error'].includes(status)) return 'failed';
  if (['blocked', 'pending'].includes(status)) return 'blocked';
  return 'starting';
}

function renderPipelineStages(stages) {
  if (!stages || stages.length === 0) return '<span style="color:var(--text-dim)">No stages</span>';
  return '<div class="pipeline-flow">' +
    stages.map((s, i) => {
      const chip = `<span class="stage-chip ${stageClass(s.status)}">${stageIcon(s.status)} ${esc(s.kind)}</span>`;
      const arrow = i < stages.length - 1 ? '<span class="stage-arrow">→</span>' : '';
      return chip + arrow;
    }).join('') +
    '</div>';
}

function emptyState(msg) {
  return `<div class="empty-state"><div class="icon">📭</div>${esc(msg)}</div>`;
}

// ── Sortable tables ──────────────────────────────────────────────────────

function sortTable(tableId, data, col, renderFn) {
  const st = sortState[tableId] || { col: null, asc: true };
  if (st.col === col) {
    st.asc = !st.asc;
  } else {
    st.col = col;
    st.asc = true;
  }
  sortState[tableId] = st;

  data.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') return st.asc ? va - vb : vb - va;
    va = String(va).toLowerCase();
    vb = String(vb).toLowerCase();
    if (va < vb) return st.asc ? -1 : 1;
    if (va > vb) return st.asc ? 1 : -1;
    return 0;
  });

  renderFn(data);
}

function sortArrow(tableId, col) {
  const st = sortState[tableId];
  if (!st || st.col !== col) return '<span class="sort-arrow">↕</span>';
  return `<span class="sort-arrow active">${st.asc ? '↑' : '↓'}</span>`;
}

// ── Data cache for sorting ───────────────────────────────────────────────
let cachedPipelines = [];
let cachedWorktrees = [];
let cachedSessions = [];

// ── Render functions ─────────────────────────────────────────────────────

function renderPipelines(data) {
  const el = document.getElementById('pipelineSection');
  document.getElementById('pipelineCount').textContent = data.length;
  if (data.length === 0) { el.innerHTML = emptyState('No pipeline runs yet'); return; }

  el.innerHTML = `<table>
    <thead><tr>
      <th onclick="sortTable('pipelines',cachedPipelines,'name',renderPipelines)">Name ${sortArrow('pipelines','name')}</th>
      <th onclick="sortTable('pipelines',cachedPipelines,'status',renderPipelines)">Status ${sortArrow('pipelines','status')}</th>
      <th>Stages</th>
      <th onclick="sortTable('pipelines',cachedPipelines,'total_cost_usd',renderPipelines)">Cost ${sortArrow('pipelines','total_cost_usd')}</th>
      <th>PR</th>
      <th onclick="sortTable('pipelines',cachedPipelines,'started_at',renderPipelines)">Started ${sortArrow('pipelines','started_at')}</th>
      <th onclick="sortTable('pipelines',cachedPipelines,'completed_at',renderPipelines)">Completed ${sortArrow('pipelines','completed_at')}</th>
    </tr></thead>
    <tbody>${data.map(p => `<tr>
      <td class="truncate mono" title="${esc(p.name)}">${esc(p.name)}</td>
      <td>${statusBadge(p.status)}</td>
      <td>${renderPipelineStages(p.stages)}</td>
      <td class="mono">${cost(p.total_cost_usd)}</td>
      <td>${p.pr_url ? `<a href="${esc(p.pr_url)}" target="_blank">PR ↗</a>` : '–'}</td>
      <td title="${fullTime(p.started_at)}">${relTime(p.started_at)}</td>
      <td title="${fullTime(p.completed_at)}">${p.completed_at ? relTime(p.completed_at) : '–'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderWorktrees(data) {
  const el = document.getElementById('worktreeSection');
  document.getElementById('worktreeCount').textContent = data.length;
  if (data.length === 0) { el.innerHTML = emptyState('No active worktrees'); return; }

  el.innerHTML = `<table>
    <thead><tr>
      <th onclick="sortTable('worktrees',cachedWorktrees,'name',renderWorktrees)">Name ${sortArrow('worktrees','name')}</th>
      <th onclick="sortTable('worktrees',cachedWorktrees,'branch_name',renderWorktrees)">Branch ${sortArrow('worktrees','branch_name')}</th>
      <th onclick="sortTable('worktrees',cachedWorktrees,'project_name',renderWorktrees)">Repo ${sortArrow('worktrees','project_name')}</th>
      <th onclick="sortTable('worktrees',cachedWorktrees,'status',renderWorktrees)">Status ${sortArrow('worktrees','status')}</th>
      <th>PR</th>
      <th onclick="sortTable('worktrees',cachedWorktrees,'created_at',renderWorktrees)">Created ${sortArrow('worktrees','created_at')}</th>
    </tr></thead>
    <tbody>${data.map(w => `<tr>
      <td class="truncate mono" title="${esc(w.name)}">${esc(w.name)}</td>
      <td class="mono">${esc(w.branch_name)}</td>
      <td class="truncate" title="${esc(w.project_path || '')}">${esc(w.project_name || '–')}</td>
      <td>${statusBadge(w.status)}</td>
      <td>${w.github_pr_url ? `<a href="${esc(w.github_pr_url)}" target="_blank">PR #${w.github_pr_number} ↗</a>` : '–'}</td>
      <td title="${fullTime(w.created_at)}">${relTime(w.created_at)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderSessions(data) {
  const el = document.getElementById('sessionSection');
  document.getElementById('sessionCount').textContent = data.length;
  if (data.length === 0) { el.innerHTML = emptyState('No sessions yet'); return; }

  el.innerHTML = `<table>
    <thead><tr>
      <th onclick="sortTable('sessions',cachedSessions,'name',renderSessions)">Name ${sortArrow('sessions','name')}</th>
      <th onclick="sortTable('sessions',cachedSessions,'harness',renderSessions)">Harness ${sortArrow('sessions','harness')}</th>
      <th onclick="sortTable('sessions',cachedSessions,'status',renderSessions)">Status ${sortArrow('sessions','status')}</th>
      <th onclick="sortTable('sessions',cachedSessions,'model',renderSessions)">Model ${sortArrow('sessions','model')}</th>
      <th onclick="sortTable('sessions',cachedSessions,'cost_usd',renderSessions)">Cost ${sortArrow('sessions','cost_usd')}</th>
      <th>Duration</th>
      <th onclick="sortTable('sessions',cachedSessions,'created_at',renderSessions)">Started ${sortArrow('sessions','created_at')}</th>
    </tr></thead>
    <tbody>${data.map(s => `<tr>
      <td class="truncate mono" title="${esc(s.name)}">${esc(s.name)}</td>
      <td>${harnessBadge(s.harness)}</td>
      <td>${statusBadge(s.status)}</td>
      <td class="mono">${esc(s.model || '–')}</td>
      <td class="mono">${cost(s.cost_usd)}</td>
      <td class="mono">${duration(s.created_at, s.completed_at)}</td>
      <td title="${fullTime(s.created_at)}">${relTime(s.created_at)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Data fetching ────────────────────────────────────────────────────────

async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    return await r.json();
  } catch (e) {
    console.error('Fetch error:', url, e);
    return null;
  }
}

async function refresh() {
  document.getElementById('refreshBtn').textContent = '⏳ Loading...';

  const [stats, pipelines, worktrees, sessions] = await Promise.all([
    fetchJSON('/api/stats'),
    fetchJSON('/api/pipelines?limit=20'),
    fetchJSON('/api/worktrees'),
    fetchJSON('/api/sessions?limit=50'),
  ]);

  // Stats
  if (stats) {
    document.getElementById('statSessions').textContent = stats.totalSessions;
    document.getElementById('statPipelines').textContent = stats.totalPipelines;
    document.getElementById('statPipelinesSub').textContent =
      stats.activePipelines > 0 ? `${stats.activePipelines} active` : '';
    document.getElementById('statCost').textContent = cost(stats.totalCostUsd);
    document.getElementById('statWorktrees').textContent = stats.activeWorktrees;

    // Session status breakdown
    const parts = Object.entries(stats.sessionsByStatus || {}).map(([k,v]) => `${v} ${k}`);
    document.getElementById('statSessionsSub').textContent = parts.join(', ');
  }

  // Tables
  if (pipelines) { cachedPipelines = pipelines; renderPipelines(pipelines); }
  if (worktrees) { cachedWorktrees = worktrees; renderWorktrees(worktrees); }
  if (sessions) { cachedSessions = sessions; renderSessions(sessions); }

  document.getElementById('refreshBtn').textContent = '🔄 Refresh';
  document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

// ── Auto-refresh ─────────────────────────────────────────────────────────

function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  const btn = document.getElementById('autoRefreshBtn');
  if (autoRefresh) {
    btn.classList.add('active');
    btn.textContent = '⏱ Auto (30s)';
    startAutoRefresh();
  } else {
    btn.classList.remove('active');
    btn.textContent = '⏱ Auto-refresh';
    stopAutoRefresh();
  }
}

function startAutoRefresh() {
  stopAutoRefresh();
  autoRefreshTimer = setInterval(refresh, 30000);
}

function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}

// ── Init ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  refresh();
  // Start with auto-refresh on
  autoRefresh = true;
  document.getElementById('autoRefreshBtn').classList.add('active');
  document.getElementById('autoRefreshBtn').textContent = '⏱ Auto (30s)';
  startAutoRefresh();
});
</script>
</body>
</html>
